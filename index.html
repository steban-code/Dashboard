<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard ESP32</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1>Dashboard de Monitoreo</h1>
        <p>ESP32 + Sensores INA219</p>
    </header>

    <main class="dashboard">

        <!-- SENSOR DE ENTRADA -->
        <section class="sensor">

            <h2>Entrada</h2>

            <div class="cards">

                <div class="card">
                    <h3>Voltaje</h3>
                    <p id="voltajeEntrada">0.00 V</p>
                </div>

                <div class="card">
                    <h3>Corriente</h3>
                    <p id="corrienteEntrada">0.00 mA</p>
                </div>

                <div class="card">
                    <h3>Potencia</h3>
                    <p id="potenciaEntrada">0.00 mW</p>
                </div>

            </div>

        </section>


        <!-- SENSOR DE SALIDA -->
        <section class="sensor">

            <h2>Salida</h2>

            <div class="cards">

                <div class="card">
                    <h3>Voltaje</h3>
                    <p id="voltajeSalida">0.00 V</p>
                </div>

                <div class="card">
                    <h3>Corriente</h3>
                    <p id="corrienteSalida">0.00 mA</p>
                </div>

                <div class="card">
                    <h3>Potencia</h3>
                    <p id="potenciaSalida">0.00 mW</p>
                </div>

            </div>

        </section>


        <!-- ESTADO -->
        <section class="estado">

            <h2>Estado del sistema</h2>

            <p id="estadoConexion">
                ESP32 desconectado
            </p>

        </section>

    </main>

    <footer>
        <p>Proyecto de monitoreo energético</p>
    </footer>

    <script src="app.js"></script>

</body>
</html>
